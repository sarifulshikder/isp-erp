services:
  # ─────────────────────────────────────────
  # CORE SERVICES (ISP ERP)
  # ─────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: isp_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASS}
    volumes:
      - mysql_data:/var/lib/mysql
    networks: [isp_net]
  redis:
    image: redis:7-alpine
    container_name: isp_redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASS}
    networks: [isp_net]
  freeradius:
    image: freeradius/freeradius-server:3.2.3
    container_name: isp_radius
    restart: always
    ports:
      - "1812:1812/udp"
      - "1813:1813/udp"
    volumes:
      - ./radius:/etc/freeradius/3.0
    networks: [isp_net]
  librenms:
    image: librenms/librenms:latest
    container_name: isp_librenms
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=mysql
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASS}
      - MAIL_DRIVER=log
      - MAIL_PORT=1025
      - MAIL_ENV_FROM_ADDR=admin@localhost
      - MAIL_ENV_FROM_NAME=ISP-ERP
      - DB_NAME=librenms
    networks: [isp_net]
  laravel:
    build:
      context: .
      dockerfile: Dockerfile.laravel
    container_name: isp_laravel
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./backend:/app
    environment:
      - WEB_DOCUMENT_ROOT=/app/public
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=${DB_NAME}
      - DB_USERNAME=${DB_USER}
      - DB_PASSWORD=${DB_PASS}
      - MAIL_DRIVER=log
      - MAIL_PORT=1025
      - MAIL_ENV_FROM_ADDR=admin@localhost
      - MAIL_ENV_FROM_NAME=ISP-ERP
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASS}
    depends_on:
      - mysql
      - redis
    networks: [isp_net]
volumes:
  mysql_data:
networks:
  isp_net:
    driver: bridge
