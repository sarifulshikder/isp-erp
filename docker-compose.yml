services:

  mysql:
    image: mysql:8.0
    container_name: isp_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASS}
    volumes:
      - mysql_data:/var/lib/mysql
    networks: [isp_net]

  redis:
    image: redis:7-alpine
    container_name: isp_redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASS}
    networks: [isp_net]

  freeradius:
    image: freeradius/freeradius-server:3.2.3
    container_name: isp_radius
    restart: always
    ports:
      - "1812:1812/udp"
      - "1813:1813/udp"
    volumes:
      - ./radius:/etc/freeradius/3.0
    networks: [isp_net]

  librenms:
    image: librenms/librenms:latest
    container_name: isp_librenms
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=mysql
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASS}
      - DB_NAME=librenms
    networks: [isp_net]

  snipeit:
    image: snipe/snipe-it:latest
    container_name: isp_snipeit
    restart: always
    ports:
      - "8081:80"
    environment:
      - APP_URL=http://10.5.31.34:8081
      - APP_KEY=${SNIPEIT_APP_KEY}
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=${DB_NAME}
      - DB_USERNAME=${DB_USER}
      - DB_PASSWORD=${DB_PASS}
    depends_on:
      - mysql
    networks: [isp_net]

  n8n:
    image: n8nio/n8n:latest
    container_name: isp_n8n
    restart: always
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD}
    volumes:
      - n8n_data:/home/node/.n8n
    networks: [isp_net]

  laravel:
    image: webdevops/php-nginx:8.4-alpine
    container_name: isp_laravel
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./backend:/app
    environment:
      - WEB_DOCUMENT_ROOT=/app/public
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=${DB_NAME}
      - DB_USERNAME=${DB_USER}
      - DB_PASSWORD=${DB_PASS}
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASS}
    depends_on:
      - mysql
      - redis
    networks: [isp_net]

volumes:
  mysql_data:
  n8n_data:

networks:
  isp_net:
    driver: bridge
